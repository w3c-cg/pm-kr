name: Report editorial checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pairs:
    name: Reports and their profiles, from reports/README.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: List every report with the profile the README says it uses
        id: list
        run: echo "matrix=$(node scripts/check-reports.mjs --list)" >> "$GITHUB_OUTPUT"

  reports:
    name: ReSpec (${{ matrix.name }}, ${{ matrix.profile }})
    needs: pairs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pairs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check source policy and rendered document
        id: editorial
        uses: danielcamposramos/respec-mcp@029f494723f88b3da3822959886b41c90da328fc # repository 0.2.0
        with:
          profile: ${{ matrix.profile }}
          sources: ${{ matrix.source }}
      - name: Preserve review evidence
        if: always() && steps.editorial.outputs.report != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-checks-${{ matrix.name }}
          path: ${{ steps.editorial.outputs.report }}
          include-hidden-files: true
          if-no-files-found: warn
