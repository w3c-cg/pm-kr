<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Morrowglass intranet</title>
<style>
body{font:20px/1.4 Georgia,serif;margin:0;background:#f4efe2;color:#222}
header{background:#203a4c;color:#fff;padding:14px 22px}h1{margin:0;font-size:30px}
main{padding:18px 22px}input,button{font:inherit;padding:6px 10px}#count{font-weight:bold;color:#a03020}
table{border-collapse:collapse;margin-top:10px}td{border:1px solid #bbb;padding:4px 10px}
</style></head><body>
<header><h1>Morrowglass Studio intranet</h1><div>An ordinary web page inside the Memory Tablet.</div></header>
<main>
<p>Today: <span id="today"></span></p>
<p><label>Note <input id="note" value="" autocomplete="off"></label> <button id="press" type="button">Press</button>
Pressed <span id="count">0</span> times. Last note: “<span id="echo"></span>”</p>
<table><tr><td>Build server</td><td>green</td></tr><tr><td>Render farm</td><td>14 of 16 nodes</td></tr><tr><td>Desk queue</td><td>see the floor</td></tr></table>
</main>
<script type="module">
import { serviceAddresses } from './addresses.mjs';

const addresses = await serviceAddresses(location);
const rigState = new URL(addresses.intranet).pathname === '/' && location.origin === new URL(addresses.intranet).origin;
let n = 0;
document.getElementById('today').textContent = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
document.getElementById('press').addEventListener('click', () => {
  document.getElementById('count').textContent = ++n;
  document.getElementById('echo').textContent = document.getElementById('note').value;
  if (rigState) fetch(new URL('state', addresses.intranet), { method: 'POST', body: JSON.stringify({ presses: n, note: document.getElementById('note').value }) }).catch(() => {});
});
</script></body></html>
